name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run per tag; different tags may run side by side.
    concurrency:
      group: docker-build-push-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract Git tag
      id: tag
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./backend/app
        platforms: linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/go-app:${{ steps.tag.outputs.TAG }}

    - name: Update deployment version file
      env:
        TAG: ${{ steps.tag.outputs.TAG }}
      run: echo "$TAG" >> backend/app/deployment-version.txt

    - name: Create deployment version PR
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        commit-message: "chore: propose deployment of ${{ steps.tag.outputs.TAG }}"
        branch: deploy/${{ steps.tag.outputs.TAG }}
        title: "Deploy ${{ steps.tag.outputs.TAG }}"
        body: |
          🚀 New Docker image [${{ steps.tag.outputs.TAG }}] has been published.

          This PR proposes deploying this version to production.

          Merge to trigger deployment via the Deploy workflow.
        base: main
        add-paths: |
          backend/app/deployment-version.txt
        labels: |
          deploy
          needs-approval
        # reviewers: |
        #   <reviewer-name>
