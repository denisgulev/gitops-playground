name: CI

# Runs on every PR (no `paths:` filter on purpose): the `CI gate` job must
# always report, otherwise a required check would stay "pending" forever on
# PRs whose files did not match a filter. Branch protection should require
# only `CI gate`.
#
# Also reused by release.yml (`workflow_call`), so a release cannot be built
# from a commit that does not pass the same checks as a PR.
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR makes the older run obsolete. Runs called from a
# release are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool versions are pinned; Dependabot does not track these, bump by hand.
  ACTIONLINT_VERSION: v1.7.12
  GOVULNCHECK_VERSION: v1.8.0
  HADOLINT_VERSION: v2.15.1
  # sha256 of hadolint-linux-x86_64 for HADOLINT_VERSION (from the release's checksums.sha256)
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507

jobs:
  go:
    name: Go (format, vet, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/app
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/app/go.mod
          cache-dependency-path: backend/app/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'gofmt -w backend/app'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Build
        run: go build ./...

      - name: Go Test
        run: go test ./... -race -v

  lint:
    name: Lint (workflows, shell, Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only used to build actionlint from source (checksummed by the Go module proxy).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/app/go.mod
          cache-dependency-path: backend/app/go.sum

      # actionlint runs shellcheck (preinstalled on ubuntu-latest) on every `run:` block.
      - name: Lint workflows (actionlint)
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Lint Dockerfile (hadolint)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" backend/app/Dockerfile

  # Fails on known vulnerabilities in the Go standard library or dependencies.
  # A new advisory can therefore turn this red without any code change: fix it by
  # bumping the Go version in go.mod (and the Dockerfile) or the affected module.
  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/app
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/app/go.mod
          cache-dependency-path: backend/app/go.sum

      - name: Run govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Builds the image from the same Dockerfile as the release and starts it, so a
  # broken Dockerfile, a missing health check or a root user is caught on the PR
  # instead of on release day. It is built for the runner's own architecture
  # (amd64); the release build only differs in the target architecture.
  image:
    name: Image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/app
          platforms: linux/amd64
          load: true
          push: false
          tags: go-app:ci
          cache-from: type=gha,scope=image-ci
          # PRs from Dependabot/forks cannot write the cache; that must not fail the build.
          cache-to: type=gha,mode=max,scope=image-ci,ignore-error=true

      - name: Smoke test the image
        run: bash scripts/smoke-test-image.sh

  # The single required check. `if: always()` makes it run (and fail) even when a
  # needed job failed or was cancelled, instead of being skipped.
  gate:
    name: CI gate
    if: always()
    needs: [go, lint, govulncheck, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all needed jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job finished with result '$result'"
              exit 1
            fi
          done
