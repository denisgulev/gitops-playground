name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/app/deployment-version.txt'
  # Manual run: redeploys the version in deployment-version.txt, or the tag given
  # here (for example to roll back to an older release).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: last line of backend/app/deployment-version.txt)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Latest version wins: a newer run replaces a queued one, but never interrupts a running deploy.
    concurrency:
      group: deploy-app
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read version tag
      id: get_tag
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        TAG="${INPUT_TAG:-$(tail -n 1 backend/app/deployment-version.txt)}"
        echo "Deploying tag: $TAG"
        echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

    - name: Deploy to EC2 via SSM
      uses: ./.github/actions/ssm-run
      with:
        script-path: scripts/deploy-app.sh
        timeout-seconds: '300'
        env: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/go-app:${{ steps.get_tag.outputs.TAG }}
          TAG=${{ steps.get_tag.outputs.TAG }}
          REGION=${{ secrets.AWS_REGION }}
