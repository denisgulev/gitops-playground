name: Deploy to EC2

# on:
#   workflow_dispatch:  # manual dispatch
on:
  push:
    branches:
      - main
    paths:
      - 'backend/app/deployment-version.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # - name: Get latest Git tag matching 'v*'
    #   id: get_tag
    #   run: |
    #     git fetch --tags
    #     TAG=$(git tag | grep '^v' | sort -V | tail -n 1)
    #     echo "TAG=$TAG" >> $GITHUB_OUTPUT
    #     echo "Latest TAG: $TAG"

    - name: Read version tag from file
      id: get_tag
      run: |
        TAG=$(tail -n 1 backend/app/deployment-version.txt)
        echo "TAG=$TAG" >> $GITHUB_OUTPUT

    - name: Get EC2 Instance ID
      id: get_instance
      run: |
        INSTANCE_ID=$(aws ssm get-parameter --name "/infra/ec2/instance_id" --query "Parameter.Value" --output text)
        echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_OUTPUT
        echo "Instance ID: $INSTANCE_ID"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}

    - name: Deploy to EC2 via SSM
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        INSTANCE_ID="${{ steps.get_instance.outputs.INSTANCE_ID }}"
        TAG="${{ steps.get_tag.outputs.TAG }}"
        IMAGE="${{ secrets.DOCKER_USERNAME }}/flask-app:${TAG}"
        REGION="${{ secrets.AWS_REGION }}"

        # Write deploy script to a temp file — values from GitHub Actions are
        # interpolated here; EC2-side variables are escaped with backslash.
        cat > /tmp/deploy.sh << EOF
        #!/bin/bash
        set -e
        IMAGE="$IMAGE"
        TAG="$TAG"
        TEMP_CONTAINER="flask-app-new"
        CURRENT_CONTAINER="flask-app"

        echo "Pulling image: \$IMAGE"
        docker pull "\$IMAGE"

        echo "Starting canary container..."
        docker rm -f "\$TEMP_CONTAINER" 2>/dev/null || true
        docker run -d --name "\$TEMP_CONTAINER" \
          -p 8001:8000 \
          -e APP_VERSION="\$TAG" \
          -e AWS_DEFAULT_REGION="$REGION" \
          -e CLOUDWATCH_LOG_GROUP=flask-app-logs \
          -e STATIC_SITE_URL=https://static-website.denisgulev.com \
          "\$IMAGE"

        sleep 5

        if curl -sf --max-time 30 http://localhost:8001/api/status | grep -q '"ok"'; then
          echo "Health check passed. Promoting..."
          docker stop "\$TEMP_CONTAINER" && docker rm "\$TEMP_CONTAINER"

          if docker ps -a --format '{{.Names}}' | grep -q "^\${CURRENT_CONTAINER}\$"; then
            docker stop "\$CURRENT_CONTAINER" && docker rm "\$CURRENT_CONTAINER"
          fi

          docker run -d --name "\$CURRENT_CONTAINER" \
            --restart unless-stopped \
            -p 8000:8000 \
            -e APP_VERSION="\$TAG" \
            -e AWS_DEFAULT_REGION="$REGION" \
            -e CLOUDWATCH_LOG_GROUP=flask-app-logs \
            -e STATIC_SITE_URL=https://static-website.denisgulev.com \
            "\$IMAGE"
          echo "Deployed: \$CURRENT_CONTAINER"
        else
          echo "Health check failed."
          docker stop "\$TEMP_CONTAINER" && docker rm "\$TEMP_CONTAINER"
          exit 1
        fi
        EOF

        # Base64-encode the script to safely pass it through SSM without quoting issues
        ENCODED=$(base64 -w 0 /tmp/deploy.sh)

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[\"echo '$ENCODED' | base64 -d | bash\"]" \
          --timeout-seconds 300 \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID"

        RESULT=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID")

        echo "--- Output ---"
        echo "$RESULT" | jq -r '.StandardOutputContent'

        STATUS=$(echo "$RESULT" | jq -r '.Status')
        if [ "$STATUS" != "Success" ]; then
          echo "--- Error ---"
          echo "$RESULT" | jq -r '.StandardErrorContent'
          exit 1
        fi