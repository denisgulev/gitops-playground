name: Terraform Apply

on:
  pull_request:
    types:
      - labeled   # Trigger when a label is added or removed
    paths:
      - 'frontend/infra/**'

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      contains(github.event.pull_request.labels.*.name, 'ready-for-tf-apply') &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref != github.event.pull_request.base.ref
    # Never run two applies against the same workspace at once, and never cancel one mid-flight.
    # Job-level (not workflow-level) so runs skipped by the `if:` above never take part.
    concurrency:
      group: terraform-apply-frontend
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend/infra
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve