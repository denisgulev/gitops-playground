name: Terraform (reusable)

# Shared by terraform-frontend.yml and terraform-backend.yml. Three stages:
#
#   checks  every run   fmt, init without a backend, validate, tflint.
#                       Needs no secrets, so it also works for fork/Dependabot PRs.
#   plan    every run   `terraform plan` against HCP Terraform, shown in the job
#                       summary. Skipped where secrets are unavailable.
#   apply   push to main or manual run on main only, and only after a reviewer
#                       approves the `infrastructure` Environment. The reviewer can
#                       read the plan job's summary before approving.
#
# REQUIRES a GitHub Environment named `infrastructure` with required reviewers,
# created BEFORE the first apply: GitHub silently creates a missing environment
# WITHOUT protection rules, which would skip the approval.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform configuration directory, e.g. frontend/infra
        type: string
        required: true
    secrets:
      TF_API_TOKEN:
        description: HCP Terraform API token (needed by plan and apply only)
        required: false

permissions:
  contents: read

env:
  # Pinned so runs are reproducible; Dependabot does not track these, bump by hand.
  TERRAFORM_VERSION: '1.10.5'
  TFLINT_VERSION: v0.64.0
  # sha256 of tflint_linux_amd64.zip for TFLINT_VERSION (from the release's checksums.txt)
  TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: no HCP Terraform access (and no token) is needed for this.
      - name: Initialize (without backend)
        env:
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          terraform init -backend=false
          if ! git diff --quiet -- .terraform.lock.hcl; then
            echo "::warning file=${WORKDIR}/.terraform.lock.hcl::'terraform init' would change the provider lock file. Run it in ${WORKDIR} and commit the result."
            git diff -- .terraform.lock.hcl | head -40
          fi

      - name: Validate
        run: terraform validate

      # Warnings (e.g. unused variables) are printed but do not fail the run; errors do.
      - name: Lint (tflint)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/tflint.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/tflint"
          "$RUNNER_TEMP/tflint/tflint" --minimum-failure-severity=error

  plan:
    name: Plan
    needs: checks
    # Secrets are not available to PRs from forks or Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push to the same PR makes the older plan obsolete; other runs are never cancelled.
    concurrency:
      group: terraform-plan-${{ inputs.working-directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Initialize
        run: terraform init

      # A remote plan in HCP Terraform. Written to a file so it can be summarised.
      - name: Plan
        shell: bash
        run: terraform plan -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Summarise plan
        if: always()
        env:
          TITLE: Terraform plan for ${{ inputs.working-directory }}
        run: bash "$GITHUB_WORKSPACE/scripts/terraform-plan-summary.sh" "$RUNNER_TEMP/plan.txt" "$TITLE"

  apply:
    name: Apply
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate: the job waits here until a required reviewer approves it.
    environment: infrastructure
    # Never two applies against one workspace at once, and never cancel one mid-flight.
    concurrency:
      group: terraform-apply-${{ inputs.working-directory }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Initialize
        run: terraform init

      - name: Apply
        run: terraform apply -auto-approve
