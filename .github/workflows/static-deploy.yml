name: Deploy Static Site to S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/static/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-static:
    name: Deploy Static Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Latest push wins: a newer run replaces a queued one, but never interrupts a running deploy.
    concurrency:
      group: deploy-static
      cancel-in-progress: false
    env:
      # Repository variables win; the secrets are only a fallback so the switch to
      # variables can happen without breaking deploys (set the variables, then
      # delete the secrets BUCKET_NAME, DISTRIBUTION_ID and AWS_REGION).
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-south-1' }}
      S3_BUCKET: ${{ vars.S3_BUCKET || secrets.BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.DISTRIBUTION_ID }}
      # The file names are not fingerprinted, so nothing may be cached for long: a
      # page that changes must reach visitors within minutes, other files within a day.
      # Used by both the upload and the verification step.
      HTML_CACHE_CONTROL: public, max-age=300
      OTHER_CACHE_CONTROL: public, max-age=86400
    steps:
      - name: Check configuration
        run: |
          for name in S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Set the repository variable $name (or, as a fallback, the secret BUCKET_NAME / DISTRIBUTION_ID)."
              exit 1
            fi
          done

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Two passes so each kind of file gets its own Cache-Control. `--delete` in
      # each pass only removes objects that match that pass's filters.
      - name: Sync to S3
        run: |
          aws s3 sync frontend/static/dist/ "s3://${S3_BUCKET}" --delete \
            --exclude "*.html" --cache-control "$OTHER_CACHE_CONTROL"
          aws s3 sync frontend/static/dist/ "s3://${S3_BUCKET}" --delete \
            --exclude "*" --include "*.html" --cache-control "$HTML_CACHE_CONTROL"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      # Fails if an object is missing, has the wrong Cache-Control, or if the
      # bucket holds something that is not in dist/.
      - name: Verify what was uploaded
        run: bash scripts/verify-static-headers.sh
