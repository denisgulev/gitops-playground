name: Backend CI (Go)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Vet, Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/app/go.mod
          cache-dependency-path: backend/app/go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Go Build
        run: go build ./...

      - name: Go Test
        run: go test ./... -race -v
