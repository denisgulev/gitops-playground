name: Deploy Grafana Stack

on:
  push:
    branches:
      - main
    paths:
      - 'observability-stack/**'
      - '!observability-stack/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Latest push wins: a newer run replaces a queued one, but never interrupts a running deploy.
    concurrency:
      group: deploy-observability
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The instance downloads this repository at the pushed commit itself (the
      # repository is public), so no files are uploaded from the runner.
      - name: Deploy observability stack via SSM
        uses: ./.github/actions/ssm-run
        with:
          script-path: scripts/deploy-observability.sh
          timeout-seconds: '600'
          env: |
            REPO=${{ github.repository }}
            SHA=${{ github.sha }}
