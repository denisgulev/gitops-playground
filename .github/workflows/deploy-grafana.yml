name: Deploy Grafana Stack

on:
  push:
    branches:
      - main
    paths:
      - 'observability-stack/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get EC2 Instance ID from SSM
        id: get_instance
        run: |
          INSTANCE_ID=$(aws ssm get-parameter --name "/infra/ec2/instance_id" --query "Parameter.Value" --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Instance ID: $INSTANCE_ID"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload observability stack files via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          INSTANCE_ID="${{ steps.get_instance.outputs.INSTANCE_ID }}"
          DEPLOY_DIR="/home/ec2-user/observability-stack"

          # Encode each file and build a shell script that writes them on EC2
          encode_file() {
            local src="$1"
            local dest="$2"
            local content
            content=$(base64 -w 0 "$src")
            echo "mkdir -p \$(dirname $dest)"
            echo "echo '$content' | base64 -d > $dest"
          }

          {
            echo "#!/bin/bash"
            echo "set -e"
            echo "mkdir -p ${DEPLOY_DIR}/provisioning/datasources"
            echo "mkdir -p ${DEPLOY_DIR}/provisioning/dashboards"

            for f in \
              observability-stack/docker-compose.yaml \
              observability-stack/promtail-config.yaml \
              observability-stack/mimir-config.yaml \
              observability-stack/prometheus.yaml \
              observability-stack/tempo-config.yaml \
              observability-stack/provisioning/datasources/loki.yaml \
              observability-stack/provisioning/dashboards/dashboards.yaml \
              observability-stack/provisioning/dashboards/flask.json; do
              dest="${DEPLOY_DIR}/${f#observability-stack/}"
              encode_file "$f" "$dest"
            done

            # Write .env only if it doesn't already exist (preserves credentials set on the instance)
            echo "if [ ! -f ${DEPLOY_DIR}/.env ]; then"
            encode_file "observability-stack/.env" "${DEPLOY_DIR}/.env"
            echo "fi"
          } > /tmp/upload.sh

          ENCODED=$(base64 -w 0 /tmp/upload.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$ENCODED' | base64 -d | bash\"]" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID")

          echo "--- Output ---"
          echo "$RESULT" | jq -r '.StandardOutputContent'
          echo "--- Error ---"
          echo "$RESULT" | jq -r '.StandardErrorContent'

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          if [ "$STATUS" != "Success" ]; then
            echo "Command status: $STATUS"
            exit 1
          fi

      - name: Deploy observability stack via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          INSTANCE_ID="${{ steps.get_instance.outputs.INSTANCE_ID }}"

          cat > /tmp/deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          DEPLOY_DIR="/home/ec2-user/observability-stack"

          # Ensure Docker Compose v2 is installed
          if ! docker-compose version >/dev/null 2>&1; then
            echo "Installing Docker Compose..."
            DOCKER_COMPOSE_VERSION="v2.36.0"
            curl -sSL "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-aarch64" -o /tmp/docker-compose
            chmod +x /tmp/docker-compose
            sudo mv /tmp/docker-compose /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
          fi

          echo "Deploying observability stack..."
          cd "$DEPLOY_DIR"
          docker-compose down
          docker-compose pull
          docker-compose up -d
          echo "Done."
          EOF

          ENCODED=$(base64 -w 0 /tmp/deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$ENCODED' | base64 -d | bash\"]" \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID")

          echo "--- Output ---"
          echo "$RESULT" | jq -r '.StandardOutputContent'
          echo "--- Error ---"
          echo "$RESULT" | jq -r '.StandardErrorContent'

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          if [ "$STATUS" != "Success" ]; then
            echo "Command status: $STATUS"
            exit 1
          fi